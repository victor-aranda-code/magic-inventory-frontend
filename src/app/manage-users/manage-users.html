<app-header [userLoggedIn]="user"></app-header>

<main class="manage-container">
    <div class="page-header">
        <div class="title-section">
            <h1>Manage Users</h1>
            <p>Control access and permissions for practitioners</p>
        </div>

        <div class="header-actions">
            @if (isChangeToBeApplied) {
            <button mat-stroked-button class="btn-cancel" (click)="cancelChanges()">
                <mat-icon>close</mat-icon> Cancel
            </button>
            <button mat-flat-button class="btn-apply" (click)="applyChanges()">
                <mat-icon>check</mat-icon> Apply Changes
            </button>
            }
        </div>
    </div>

    <div class="table-card">
        <table mat-table [dataSource]="users">
            <!-- ID Column -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let element">
                    <code>{{element.id}}</code>
                </td>
            </ng-container>

            <!-- Username Column -->
            <ng-container matColumnDef="username">
                <th mat-header-cell *matHeaderCellDef> Username </th>
                <td mat-cell *matCellDef="let element" style="font-weight: 600;"> {{element.username}} </td>
            </ng-container>

            <!-- Role Column -->
            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef> Role </th>
                <td mat-cell *matCellDef="let element">
                    <span class="role-badge" [ngClass]="element.role === 'ADMIN' ? 'role-admin' : 'role-user'">
                        {{element.role}}
                    </span>
                </td>
            </ng-container>

            <!-- Enabled Column -->
            <ng-container matColumnDef="enabled">
                <th mat-header-cell *matHeaderCellDef> Status </th>
                <td mat-cell *matCellDef="let element">
                    <mat-checkbox color="primary" class="status-checkbox" [checked]="element.enabled"
                        (change)="updateEnabled(element.id, $event)">
                        {{ element.enabled ? 'Active' : 'Disabled' }}
                    </mat-checkbox>
                </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Actions </th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button class="btn-delete" (click)="deleteUser(element.id)" title="Delete User">
                        <mat-icon>delete_outline</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</main>
