<div class="container">
    <h1>Login</h1>
    <mat-form-field class="username-form-field">
        <mat-label>Username</mat-label>
        <input matInput type="text" id="username" [(ngModel)]="username"/>
    </mat-form-field>
    <mat-form-field class="password-form-field">
        <mat-label>Enter your password</mat-label>
    <input matInput [type]="hidePassword() ? 'password' : 'text'" id="password" [(ngModel)]="password"/>
    <button
      matIconButton
      matSuffix
      (click)="clickEvent($event)"
      [attr.aria-label]="'Hide password'"
      [attr.aria-pressed]="hidePassword()"
    >
      <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
  </mat-form-field>
  <button mat-raised-button color="primary" (click)="login()">Login</button>
  <button mat-raised-button color="primary" (click)="router.navigate(['/register']);">Register</button>
</div>
