version: '3.8'

services:
  magic-inventory-frontend:
    image: magic-inventory-frontend:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - magic-inventory-backend
    environment:
      - BACKEND_URL=http://magic-inventory-backend:8080

  magic-inventory-backend:
    image: magic-inventory-backend:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # The following variables should be defined in the Azure Web App Application Settings
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - AZURE_ENDPOINT=${AZURE_ENDPOINT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
