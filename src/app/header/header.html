<div class="header-container">
    <div class="logo-section">
        <img src="assets/logo.png" alt="" style="height: 32px; width: auto; border-radius: 4px;">
        <button mat-icon-button (click)="goToHome()">
            <mat-icon>home</mat-icon>
        </button>
        <h1>Magic Inventory</h1>
    </div>

    <div class="user-section">
        @if (userLoggedIn.role === Role.ADMIN) {
        <span class="admin-badge">Admin</span>
        }
        <button mat-button class="logout-btn" (click)="logout()">Logout</button>
    </div>
</div>
