<div class="container">
  <h1>Register</h1>
  <mat-form-field class="username-form-field">
    <mat-label>Enter your username</mat-label>
    <input matInput type="text" [(ngModel)]="username" />
  </mat-form-field>
  <mat-form-field class="password-form-field">
    <mat-label>Enter your new password</mat-label>
    <input matInput [type]="hidePassword() ? 'password' : 'text'" [(ngModel)]="password" (blur)="checkPasswords()" />
    <button class="password-toggle-button" matIconButton matSuffix (click)="clickEvent($event)"
      [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword()">
      <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
  </mat-form-field>
  <mat-form-field class="2password-form-field">
    <mat-label>Confirm your new password</mat-label>
    <input matInput [type]="hidePassword() ? 'password' : 'text'" [(ngModel)]="confirmPassword"
      (blur)="checkPasswords()" />
    <button class="password-toggle-button" matIconButton matSuffix (click)="clickEvent($event)"
      [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword()">
      <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
  </mat-form-field>
  <p [hidden]="userErrorMessage === ''" style="color: red;">{{userErrorMessage}}</p>
  <button mat-raised-button class="register-button" color="primary" (click)="register()">Register</button>
</div>
