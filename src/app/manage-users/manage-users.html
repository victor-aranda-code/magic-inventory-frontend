<div>
    <div>
        <button mat-button="outlined" (click)="cancelChanges()">Cancel Changes</button>    
        <button mat-button="outlined" (click)="applyChanges()">Apply Changes</button>
    </div>
    <h1>Manage Users</h1>
    <table mat-table [dataSource]="users" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>
        <ng-container matColumnDef="username">
            <td mat-cell *matCellDef="let element"> {{element.username}} </td>
        </ng-container>
        <ng-container matColumnDef="password">
            <td mat-cell *matCellDef="let element"> {{element.password}} </td>
        </ng-container>
        <ng-container matColumnDef="locked">
            <td mat-cell *matCellDef="let element"> {{element.locked}} </td>
        </ng-container>
        <ng-container matColumnDef="locked">
            <td mat-cell *matCellDef="let element"> <mat-checkbox class="example-margin" (change)="updateInLocked(element.id, $event)"></mat-checkbox> </td>
        </ng-container>
        <ng-container matColumnDef="role">
            <td mat-cell *matCellDef="let element"> <button mat-icon-button (click)="deleteUser(element.id)"><mat-icon>delete</mat-icon></button> </td>
        </ng-container>
    </table>
</div>
